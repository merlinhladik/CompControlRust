<?xml version="1.0" encoding="UTF-8"?>
<!-- Wiegekarte template for Affinity Publisher data merge.
     One card = 105 x 59.4 mm  ->  2 x 5 grid fills an A4 sheet exactly.
     «token» placeholders match the CSV headers of GET /api/export/wiegekarten.csv:
     id, nachname, vorname, verein, geschlecht, jahrgang, altersklasse -->
<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="59.4mm" viewBox="0 0 105 59.4">
  <!-- cut line -->
  <rect x="0.25" y="0.25" width="104.5" height="58.9" fill="white" stroke="#999999" stroke-width="0.25" stroke-dasharray="2 1.5"/>

  <!-- header -->
  <text x="7" y="12" font-family="Helvetica, Arial, sans-serif" font-size="5.2" font-weight="bold" fill="#111111">«nachname», «vorname»</text>
  <text x="7" y="18.5" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#333333">«verein»</text>
  <text x="7" y="24" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#666666">«geschlecht» · «jahrgang» · «altersklasse»</text>

  <line x1="7" y1="27.5" x2="98" y2="27.5" stroke="#cccccc" stroke-width="0.2"/>

  <!-- weigh-in blanks (filled by hand at the scale) -->
  <text x="7" y="38" font-family="Helvetica, Arial, sans-serif" font-size="3.8" fill="#111111">Gewicht:</text>
  <line x1="24" y1="38.5" x2="62" y2="38.5" stroke="#111111" stroke-width="0.3"/>
  <text x="64" y="38" font-family="Helvetica, Arial, sans-serif" font-size="3.8" fill="#111111">kg</text>

  <text x="7" y="50" font-family="Helvetica, Arial, sans-serif" font-size="3.8" fill="#111111">Unterschrift Kampfrichter:</text>
  <line x1="52" y1="50.5" x2="98" y2="50.5" stroke="#111111" stroke-width="0.3"/>

  <!-- merge key / QR value -->
  <text x="98" y="56.5" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#999999">ID «id»</text>
</svg>
